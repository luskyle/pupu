name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 代码检查与打包
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck && pnpm desktop:typecheck

      - name: 单元测试
        run: pnpm test

      - name: 桌面 Chromium 冒烟测试（不下载模型）
        # Ubuntu runner 的 AppArmor 默认限制 Chromium 的 user namespace sandbox。
        # 仅调整临时 runner，不使用 --no-sandbox。
        run: |
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          xvfb-run --auto-servernum pnpm desktop:smoke
          xvfb-run --auto-servernum node_modules/.bin/electron build/desktop/main.cjs --workspace-smoke

      - name: 校验 Pages 静态内容
        run: node scripts/inject-site-version.mjs docs build/pages-check

      - name: 读取版本号
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: 构建扩展
        run: pnpm build:ci

      - name: 校验产物
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          node scripts/verify-extension-packages.mjs "$VERSION"
          sha256sum "build/pupu-v${VERSION}.zip" "build/pupu-firefox-v${VERSION}.zip"

      - name: 打包并校验 CRX（用临时密钥冒烟测试）
        run: |
          set -eu
          mkdir -p keys
          openssl genrsa -out keys/pupu.pem 2048 2>/dev/null
          pnpm crx
          pnpm verify:crx

      - name: 上传 Chromium 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: pupu-chrome-mv3-${{ steps.version.outputs.version }}
          path: |
            build/pupu-v${{ steps.version.outputs.version }}.zip
            build/chrome-mv3-prod
          if-no-files-found: error
          retention-days: 14

      - name: 上传 Firefox 构建产物
        uses: actions/upload-artifact@v7
        with:
          name: pupu-firefox-mv3-${{ steps.version.outputs.version }}
          path: |
            build/pupu-firefox-v${{ steps.version.outputs.version }}.zip
            build/firefox-mv3-prod
          if-no-files-found: error
          retention-days: 14