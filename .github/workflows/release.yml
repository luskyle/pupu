name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.2.5）。留空则使用 package.json 中的版本号"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          fi
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 同步 package.json 版本号
        run: pnpm pkg set version="${{ steps.version.outputs.version }}"

      - name: 写入 CRX 签名密钥
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "缺少仓库 Secret CRX_PRIVATE_KEY，无法签名 CRX"
            echo "在本地生成密钥后执行: gh secret set CRX_PRIVATE_KEY < keys/pupu.pem"
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$CRX_PRIVATE_KEY" > keys/pupu.pem
          chmod 600 keys/pupu.pem

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建扩展
        run: pnpm build:ci

      - name: 打包 CRX（Chrome / Edge 可直接安装）
        env:
          CRX_REQUIRED: "1"
        run: pnpm crx

      - name: 校验 CRX3 签名与内容
        run: pnpm verify:crx

      - name: 校验产物版本
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          zip="build/pupu-v${VERSION}.zip"
          test -f "$zip" || { echo "未找到构建产物 $zip"; ls -l build; exit 1; }
          manifest_version=$(unzip -p "$zip" manifest.json | node -e "let s='';process.stdin.on('data',(d)=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          echo "tag/输入版本: $VERSION / manifest: $manifest_version"
          test "$VERSION" = "$manifest_version"
          for f in pdf.worker.min.mjs wasm assets/platforms/51cto.ico; do
            unzip -l "$zip" | grep -q "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "SHA256(zip): $(sha256sum "$zip" | cut -d' ' -f1)"
          echo "SHA256(crx): $(sha256sum "build/pupu-v${VERSION}.crx" | cut -d' ' -f1)"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          ZIP="build/pupu-v${VERSION}.zip"
          CRX="build/pupu-v${VERSION}.crx"
          test -f "$ZIP"
          test -f "$CRX"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" "$ZIP" "$CRX" \
              --title "pupu $TAG" \
              --generate-notes
          else
            gh release create "$TAG" "$ZIP" "$CRX" \
              --title "pupu $TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi