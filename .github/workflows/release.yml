name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不含 v 前缀，如 0.2.5）。留空则使用 package.json 中的版本号"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # 发布完成后需要触发 Deploy Pages（workflow_dispatch 要求 actions: write）
  actions: write

jobs:
  release:
    name: 打包并发布 Release
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 解析版本号
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              VERSION="${GITHUB_REF_NAME#v}"
            else
              VERSION="$(node -p "require('./package.json').version")"
            fi
          fi
          echo "版本号: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # 扩展内「关于」页显示的是构建时 manifest 里的版本，而 manifest 版本来自 package.json。
      # 因此标签必须与 package.json 一致，否则本地/CI 构建出来的「关于」页会显示错的版本。
      # 这里刻意「校验并报错」而不是静默改版本号，避免仓库版本与已发布版本悄悄漂移。
      - name: 校验标签与 package.json 版本一致
        if: github.ref_type == 'tag'
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ 标签 v${TAG_VERSION} 与 package.json 的版本 ${PKG_VERSION} 不一致"
            echo "   请先把 package.json 的版本改为 ${TAG_VERSION} 并提交到 main，再打标签："
            echo "     pnpm pkg set version=${TAG_VERSION} && git commit -am \"chore(release): ${TAG_VERSION}\""
            exit 1
          fi
          echo "✅ 标签与 package.json 版本一致：${PKG_VERSION}"

      - name: 同步 package.json 版本号
        run: pnpm pkg set version="${{ steps.version.outputs.version }}"

      - name: 写入 CRX 签名密钥
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          set -eu
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "缺少仓库 Secret CRX_PRIVATE_KEY，无法签名 CRX"
            echo "在本地生成密钥后执行: gh secret set CRX_PRIVATE_KEY < keys/pupu.pem"
            exit 1
          fi
          mkdir -p keys
          printf '%s\n' "$CRX_PRIVATE_KEY" > keys/pupu.pem
          chmod 600 keys/pupu.pem

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 构建扩展
        run: pnpm build:ci

      - name: 打包 CRX（Chrome / Edge 可直接安装）
        env:
          CRX_REQUIRED: "1"
        run: pnpm crx

      - name: 校验 CRX3 签名与内容
        run: pnpm verify:crx

      - name: 校验产物版本
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          zip="build/pupu-v${VERSION}.zip"
          test -f "$zip" || { echo "未找到构建产物 $zip"; ls -l build; exit 1; }
          manifest_version=$(unzip -p "$zip" manifest.json | node -e "let s='';process.stdin.on('data',(d)=>s+=d).on('end',()=>console.log(JSON.parse(s).version))")
          echo "tag/输入版本: $VERSION / manifest: $manifest_version"
          test "$VERSION" = "$manifest_version"
          for f in pdf.worker.min.mjs wasm assets/platforms/51cto.ico; do
            unzip -l "$zip" | grep -q "$f" || { echo "缺少 $f"; exit 1; }
          done
          echo "SHA256(zip): $(sha256sum "$zip" | cut -d' ' -f1)"
          echo "SHA256(crx): $(sha256sum "build/pupu-v${VERSION}.crx" | cut -d' ' -f1)"

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          TAG="v${VERSION}"
          ZIP="build/pupu-v${VERSION}.zip"
          CRX="build/pupu-v${VERSION}.crx"
          test -f "$ZIP"
          test -f "$CRX"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            gh release create "$TAG" "$ZIP" "$CRX" \
              --title "pupu $TAG" \
              --generate-notes
          else
            gh release create "$TAG" "$ZIP" "$CRX" \
              --title "pupu $TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi

      # 站点上的版本号取自「最新 v* 标签」，因此发版后需要重新部署一次站点才能刷新
      # （Deploy Pages 只监听 docs/** 的推送，不会因打标签而自动触发）。
      # 这一步失败不影响已完成的发布，只是站点静态版本号会滞后到下次部署。
      - name: 触发站点重新部署（同步站点版本号）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run pages.yml --ref main; then
            echo "✅ 已触发 Deploy Pages，站点版本号将与本次发布同步"
          else
            echo "⚠️ 触发 Deploy Pages 失败（不影响本次发布）；可在 Actions 页面手动运行 Deploy Pages"
          fi