name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/inject-site-version.mjs"
      - ".github/workflows/pages.yml"
  # 发布流程在创建 Release 后会触发本工作流（GITHUB_TOKEN 可以触发 workflow_dispatch），
  # 这样每发一个版本，站点上的版本号也会同步刷新
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: 部署站点
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 需要读取标签来取「最新已发布版本」，浅克隆拿不到标签
          fetch-depth: 0
          fetch-tags: true

      - name: 注入站点版本号
        run: node scripts/inject-site-version.mjs docs dist-pages

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5